# GitHub Actions workflow for testing and continuous integration.
#
# This file performs testing using tox and tox.ini to define and configure the test environments.

name: CI Tests

on:
  push:
    branches:
    - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check_commit:
    # Check the commit message for the presence of keywords that indicate
    # that the CI tests should be skipped, in favor of running doc builds only.
    # Messages like [docs only], [docs-only], or [skip-tests] will skip
    # Only the CI part of the workflow, not the doc build.
    # [skip ci], [ci skip] etc. are instead handled by GitHub itself and will skip
    # the entire workflow.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{github.event.pull_request.head.repo.full_name}}
      # Found this solution at
      # https://monadical.com/posts/filters-github-actions.html#Case-2-Pull-request
      - name: check if message indicates that tests should be skipped
        id: check_commit
        run: |
          message=$(git log -1 --pretty=format:'%B')
          re="\[(docs.only|skip-tests).*\]"
          if [[ $message =~ $re ]]; then
            echo "match=true" >> $GITHUB_OUTPUT
            echo "$message -> Match is true"
          else
            echo "$message -> Match is false"
          fi
    outputs:
      match: ${{ steps.check_commit.outputs.match }}

  docs-tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Test building of Sphinx docs
            os: ubuntu-latest
            python: '3.12'
            toxenv: build_docs
          - name: Test links of Sphinx docs
            os: ubuntu-latest
            python: '3.12'
            toxenv: linkcheck

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install base dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox tox-uv
      - name: Install system dependencies
        run: sudo apt-get -y install graphviz pandoc
      - name: Run tests
        run: tox -e ${{ matrix.toxenv }}

  ci-tests:
    needs: check_commit
    if: ${{ needs.check_commit.outputs.match != 'true' }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Normal runs take ~10 minutes; don't let a hung test burn the 6-hour default
    timeout-minutes: 60

    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Code style checks
            os: ubuntu-latest
            python: '3.12'
            toxenv: codestyle
            experimental: false

          - name: Linux - Python 3.12 with the oldest supported dependencies
            os: ubuntu-latest
            python: '3.12'
            toxenv: py312-test-oldestdeps
            experimental: false

          - name: Linux - Python 3.13 with all optional dependencies and coverage checking
            os: ubuntu-latest
            python: '3.13'
            toxenv: py313-test-alldeps-cov
            experimental: false

          - name: OS X - Python 3.13 with all optional dependencies
            os: macos-latest
            python: '3.13'
            toxenv: py313-test-alldeps
            experimental: false

          - name: Windows - Python 3.12 with all optional dependencies
            os: windows-latest
            python: '3.12'
            toxenv: py312-test-alldeps
            experimental: false

          - name: Linux - Python 3.13 with the development versions of key dependencies
            os: ubuntu-latest
            python: '3.13'
            toxenv: py313-test-devdeps
            experimental: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Set up python ${{ matrix.python }} on ${{ matrix.os }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python }}
    - name: Install base dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install tox tox-uv
    - name: Test with tox
      run: tox -e ${{ matrix.toxenv }}
    - name: Upload coverage to codecov
      if: "endsWith(matrix.toxenv, '-cov')"
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
