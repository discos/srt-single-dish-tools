# GitHub Actions workflow that runs on a cron schedule.

name: Cron Scheduled CI Tests

on:
  schedule:
    # run at 6am UTC on Mondays
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  ci_tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Python 3.13 with minimal dependencies
            os: ubuntu-latest
            python: '3.13'
            toxenv: py313-test
          - name: Python 3.13 with the development versions of key dependencies
            os: ubuntu-latest
            python: '3.13'
            toxenv: py313-test-devdeps
          - name: Python 3.9 with the oldest supported dependencies
            os: ubuntu-latest
            python: '3.9'
            toxenv: py39-test-oldestdeps
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Set up python ${{ matrix.python }} on ${{ matrix.os }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python }}
    - name: Install base dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install tox tox-uv
    - name: Test with tox
      run: tox -e ${{ matrix.toxenv }}

  doc_test:
    name: 'Check docs links'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Set up Python to build docs with sphinx
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install base dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install tox tox-uv
    - name: Check links in docs using tox
      run: tox -e linkcheck
